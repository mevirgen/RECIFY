<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolabından Tarif</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=Markazi+Text:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap');

  :root{
    --ink:#1B2420;
    --ink-soft:#4B564C;
    --paper:#F4F1E4;
    --paper-dim:#E9E4D2;
    --sage:#7C8C6B;
    --rust:#B5502F;
    --mustard:#D6A419;
    --line: rgba(27,36,32,0.14);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body.lang-ar{
    font-family:'Tajawal', sans-serif;
  }
  body.lang-ar h1,
  body.lang-ar .eyebrow,
  body.lang-ar .panel-label,
  body.lang-ar .result-card h2,
  body.lang-ar .section-title,
  body.lang-ar #generate-btn{
    font-family:'Markazi Text', serif;
  }
  body.lang-ar .steps li::before{
    font-family:'Markazi Text', serif;
  }

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* HEADER */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:56px 24px 64px;
    position:relative;
  }
  .header-inner{
    max-width:760px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .lang-toggle{
    position:absolute;
    top:24px;
    right:24px;
    display:flex;
    border:1px solid rgba(244,241,228,0.35);
    border-radius:999px;
    overflow:hidden;
  }
  .lang-toggle button{
    background:none;
    border:none;
    color:rgba(244,241,228,0.6);
    font-family:'Karla',sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.02em;
    padding:7px 12px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .lang-toggle button.active{
    background:var(--paper);
    color:var(--ink);
  }
  .eyebrow{
    color:var(--mustard);
    font-size:15px;
    font-weight:600;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(38px, 6vw, 58px);
    line-height:1.05;
    max-width:11ch;
  }
  .sub{
    color:rgba(244,241,228,0.72);
    font-size:17px;
    max-width:46ch;
  }

  /* MAIN LAYOUT */
  main{
    max-width:760px;
    margin:0 auto;
    padding:48px 24px 120px;
  }

  .panel-label{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:600;
    margin-bottom:6px;
  }
  .panel-hint{
    color:var(--ink-soft);
    font-size:14.5px;
    margin-bottom:20px;
  }

  .input-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  #ingredient-input{
    flex:1;
    background:transparent;
    border:none;
    border-bottom:2px solid var(--line);
    font-family:'Karla',sans-serif;
    font-size:17px;
    padding:10px 2px;
    color:var(--ink);
    outline:none;
    transition:border-color .2s ease;
  }
  #ingredient-input:focus{ border-color:var(--ink); }
  #ingredient-input::placeholder{ color:#8C8C7D; }

  #add-btn{
    background:none;
    border:2px solid var(--ink);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:0 20px;
    cursor:pointer;
    transition:all .15s ease;
  }
  #add-btn:hover{ background:var(--ink); color:var(--paper); }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    min-height:38px;
    margin-bottom:28px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper-dim);
    border:1px solid var(--line);
    padding:7px 8px 7px 14px;
    font-size:14.5px;
    color:var(--ink);
  }
  .chip button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:15px;
    cursor:pointer;
    line-height:1;
    padding:2px 4px;
  }
  .chip button:hover{ color:var(--rust); }

  .empty-hint{
    color:#8C8C7D;
    font-size:14px;
    font-style:italic;
    padding:8px 0;
  }

  .meal-select{
    margin-bottom:28px;
  }
  .meal-options{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .meal-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Karla',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:9px 16px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .meal-btn:hover{ border-color:var(--ink); color:var(--ink); }
  .meal-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  #generate-btn{
    width:100%;
    background:var(--rust);
    color:var(--paper);
    border:none;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    padding:16px;
    cursor:pointer;
    transition:background .18s ease;
  }
  #generate-btn:hover:not(:disabled){ background:#973E23; }
  #generate-btn:disabled{
    background:#B8AF9C;
    cursor:not-allowed;
  }

  /* RESULT */
  #result-area{
    margin-top:52px;
  }
  .result-card{
    border-top:2px solid var(--ink);
    padding-top:28px;
  }
  .result-card h2{
    font-family:'Fraunces', serif;
    font-size:30px;
    font-weight:600;
    margin-bottom:6px;
  }
  .result-desc{
    color:var(--ink-soft);
    font-size:15.5px;
    margin-bottom:18px;
    max-width:56ch;
  }
  .meta-row{
    display:flex;
    gap:20px;
    margin-bottom:28px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .meta-row span{ color:var(--ink); font-weight:600; }

  .section-title{
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    margin:26px 0 12px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }

  .ing-list{ list-style:none; }
  .ing-list li{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px dotted var(--line);
    font-size:15px;
  }
  .ing-list li span.amount{ color:var(--ink-soft); }
  .ing-list li.have{ color:var(--sage); font-weight:600; }

  .steps{ counter-reset:step; list-style:none; }
  .steps li{
    counter-increment:step;
    display:flex;
    gap:16px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    font-size:15.5px;
  }
  .steps li::before{
    content:counter(step);
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    color:var(--rust);
    min-width:22px;
  }

  .tip-box{
    margin-top:22px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--mustard);
    font-size:14.5px;
    color:var(--ink-soft);
  }

  /* STATES */
  .state-msg{
    padding:32px 0;
    color:var(--ink-soft);
    font-size:15px;
  }
  .state-msg.error{ color:var(--rust); }

  .spinner{
    display:inline-block;
    width:16px; height:16px;
    border:2px solid rgba(244,241,228,0.4);
    border-top-color:var(--paper);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin-right:10px;
    vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* SAVED RECIPES */
  .saved-toggle-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom:8px;
  }
  #saved-toggle{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'Karla',sans-serif;
    font-size:13.5px;
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    padding:4px 0;
  }
  #saved-toggle:hover{ color:var(--ink); }

  .save-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:9px 16px;
    cursor:pointer;
    margin-top:22px;
    transition:all .15s ease;
  }
  .save-btn:hover{ border-color:var(--sage); color:var(--sage); }
  .save-btn.saved{
    border-color:var(--sage);
    color:var(--sage);
    cursor:default;
  }

  #saved-panel{
    border-top:2px solid var(--ink);
    padding-top:24px;
    margin-bottom:8px;
  }
  .saved-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    padding:13px 0;
    border-bottom:1px dotted var(--line);
    cursor:pointer;
  }
  .saved-item:hover .saved-item-title{ color:var(--rust); }
  .saved-item-title{
    font-family:'Fraunces', serif;
    font-size:16.5px;
    font-weight:600;
    transition:color .15s ease;
  }
  .saved-item-meta{
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .saved-item-delete{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:15px;
    cursor:pointer;
    padding:2px 6px;
  }
  .saved-item-delete:hover{ color:var(--rust); }
  .saved-empty{
    color:#8C8C7D;
    font-size:14px;
    font-style:italic;
    padding:8px 0 24px;
  }

  @media (max-width:480px){
    header{ padding:80px 20px 48px; }
    .lang-toggle{ top:20px; right:20px; }
  }
</style>
</head>
<body>

<header>
  <div class="lang-toggle">
    <button id="lang-tr" class="active">TR</button>
    <button id="lang-en">EN</button>
    <button id="lang-ar">AR</button>
  </div>
  <div class="header-inner">
    <div class="eyebrow" id="t-eyebrow">Buzdolabı asistanı</div>
    <h1 id="t-title">Dolabındakilerle ne pişirsem?</h1>
    <p class="sub" id="t-sub">Elindeki malzemeleri yaz, sana uygun bir tarif hazırlayalım.</p>
  </div>
</header>

<main>
  <div class="panel-label" id="t-panel-label">Malzemelerin</div>
  <p class="panel-hint" id="t-panel-hint">Elinde ne varsa tek tek ekle — az ya da çok, fark etmez.</p>

  <div class="input-row">
    <input type="text" id="ingredient-input" placeholder="ör. yumurta, ıspanak, peynir...">
    <button id="add-btn">Ekle</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="meal-select">
    <div class="panel-label" id="t-meal-label" style="font-size:17px;">Öğün</div>
    <div class="meal-options" id="meal-options"></div>
  </div>

  <button id="generate-btn" disabled>Tarif Öner</button>

  <div id="result-area"></div>
</main>

<script>
const translations = {
  tr: {
    eyebrow: "Buzdolabı asistanı",
    title: "Dolabındakilerle ne pişirsem?",
    sub: "Elindeki malzemeleri yaz, sana uygun bir tarif hazırlayalım.",
    panelLabel: "Malzemelerin",
    panelHint: "Elinde ne varsa tek tek ekle. Miktar da yazarsan tarif ona göre ayarlanır (ör. \"3 yumurta\").",
    placeholder: "ör. 3 yumurta, yarım demet ıspanak...",
    addBtn: "Ekle",
    generateBtn: "Tarif Öner",
    generating: "Tarif hazırlanıyor...",
    emptyHint: "Henüz malzeme eklemedin.",
    errorMsg: "Bir şeyler ters gitti, tekrar dener misin?",
    ingredientsTitle: "Malzemeler",
    stepsTitle: "Yapılışı",
    tipTitle: "İpucu",
    haveLabel: "elinde var",
    timeLabel: "Süre",
    servesLabel: "Kişilik",
    minSuffix: "dk",
    mealLabel: "Öğün",
    meals: { any: "Fark Etmez", breakfast: "Kahvaltı", lunch: "Öğle Yemeği", dinner: "Akşam Yemeği" }
  },
  en: {
    eyebrow: "Fridge assistant",
    title: "What can I cook with this?",
    sub: "List what you have, and we'll put together a recipe for you.",
    panelLabel: "Your ingredients",
    panelHint: "Add each ingredient you have. Include quantities if you know them (e.g. \"3 eggs\") and the recipe will match.",
    placeholder: "e.g. 3 eggs, half a bunch of spinach...",
    addBtn: "Add",
    generateBtn: "Suggest a Recipe",
    generating: "Cooking up a recipe...",
    emptyHint: "You haven't added any ingredients yet.",
    errorMsg: "Something went wrong — want to try again?",
    ingredientsTitle: "Ingredients",
    stepsTitle: "Steps",
    tipTitle: "Tip",
    haveLabel: "you have this",
    timeLabel: "Time",
    servesLabel: "Serves",
    minSuffix: "min",
    mealLabel: "Meal",
    meals: { any: "Any", breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner" }
  },
  ar: {
    eyebrow: "مساعد الثلاجة",
    title: "ماذا يمكنني أن أطبخ بهذا؟",
    sub: "اكتب ما لديك من مكونات، وسنجهز لك وصفة مناسبة.",
    panelLabel: "مكوناتك",
    panelHint: "أضف كل مكون لديك على حدة. اذكر الكمية إن عرفتها (مثل \"3 بيضات\") لتُلائم الوصفة.",
    placeholder: "مثال: 3 بيضات، نصف حزمة سبانخ...",
    addBtn: "إضافة",
    generateBtn: "اقترح وصفة",
    generating: "جارٍ تحضير الوصفة...",
    emptyHint: "لم تُضف أي مكونات بعد.",
    errorMsg: "حدث خطأ ما، هل تريد المحاولة مرة أخرى؟",
    ingredientsTitle: "المكونات",
    stepsTitle: "طريقة التحضير",
    tipTitle: "نصيحة",
    haveLabel: "متوفر لديك",
    timeLabel: "الوقت",
    servesLabel: "عدد الأشخاص",
    minSuffix: "د",
    mealLabel: "الوجبة",
    meals: { any: "لا يهم", breakfast: "فطور", lunch: "غداء", dinner: "عشاء" }
  }
};

let currentLang = 'tr';
let ingredients = [];
let selectedMeal = 'any';
const mealOrder = ['any', 'breakfast', 'lunch', 'dinner'];

const $ = (id) => document.getElementById(id);

function applyLang(lang){
  currentLang = lang;
  const t = translations[lang];
  $('t-eyebrow').textContent = t.eyebrow;
  $('t-title').textContent = t.title;
  $('t-sub').textContent = t.sub;
  $('t-panel-label').textContent = t.panelLabel;
  $('t-panel-hint').textContent = t.panelHint;
  $('ingredient-input').placeholder = t.placeholder;
  $('add-btn').textContent = t.addBtn;
  $('generate-btn').textContent = t.generateBtn;
  $('lang-tr').classList.toggle('active', lang === 'tr');
  $('lang-en').classList.toggle('active', lang === 'en');
  $('lang-ar').classList.toggle('active', lang === 'ar');
  $('t-meal-label').textContent = t.mealLabel;
  renderChips();
  renderMealOptions();
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.body.classList.toggle('lang-ar', lang === 'ar');
}

function renderMealOptions(){
  const t = translations[currentLang];
  const container = $('meal-options');
  container.innerHTML = '';
  mealOrder.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'meal-btn' + (selectedMeal === key ? ' active' : '');
    btn.textContent = t.meals[key];
    btn.onclick = () => { selectedMeal = key; renderMealOptions(); };
    container.appendChild(btn);
  });
}

$('lang-tr').addEventListener('click', () => applyLang('tr'));
$('lang-en').addEventListener('click', () => applyLang('en'));
$('lang-ar').addEventListener('click', () => applyLang('ar'));

function renderChips(){
  const container = $('chips');
  container.innerHTML = '';
  if(ingredients.length === 0){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = translations[currentLang].emptyHint;
    container.appendChild(hint);
  } else {
    ingredients.forEach((ing, idx) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      const span = document.createElement('span');
      span.textContent = ing;
      const btn = document.createElement('button');
      btn.textContent = '×';
      btn.onclick = () => { ingredients.splice(idx, 1); renderChips(); };
      chip.appendChild(span);
      chip.appendChild(btn);
      container.appendChild(chip);
    });
  }
  $('generate-btn').disabled = ingredients.length === 0;
}

function addIngredient(){
  const input = $('ingredient-input');
  const val = input.value.trim();
  if(val){
    ingredients.push(val);
    input.value = '';
    renderChips();
  }
  input.focus();
}

$('add-btn').addEventListener('click', addIngredient);
$('ingredient-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); addIngredient(); }
});

async function generateRecipe(){
  const t = translations[currentLang];
  const genBtn = $('generate-btn');
  const resultArea = $('result-area');
  genBtn.disabled = true;
  genBtn.innerHTML = `<span class="spinner"></span>${t.generating}`;
  resultArea.innerHTML = '';

  const langName = currentLang === 'tr' ? 'Turkish' : (currentLang === 'ar' ? 'Arabic' : 'English');
  const mealInstruction = selectedMeal === 'any'
    ? 'The recipe can be for any meal of the day.'
    : `The recipe MUST be appropriate for ${selectedMeal} specifically — choose a dish people would actually eat at that meal, not just any dish that uses the ingredients.`;

  const systemPrompt = `You are a creative home-cooking assistant. Given a list of ingredients the user has available, propose ONE delicious, realistic recipe that primarily uses those ingredients (you may assume basic pantry staples like salt, pepper, oil, water are also available even if not listed). ${mealInstruction} Some ingredient entries may include a quantity the user actually has (e.g. "3 eggs", "half a bunch of spinach") — treat that as a hard limit and do not call for more of that ingredient than the user has on hand; scale the recipe (servings, other ingredient amounts) to fit within that constraint. If no quantity is given for an ingredient, assume a normal amount is available. Respond ONLY with a single valid JSON object, no markdown fences, no preamble, no explanation outside the JSON. All text values must be written in ${langName}. Use this exact schema:
{
  "title": "string",
  "description": "one enticing sentence, max 25 words",
  "time_minutes": number,
  "servings": number,
  "ingredients": [ {"name": "string", "amount": "string", "have": boolean} ],
  "steps": ["string", "string", ...],
  "tip": "one short helpful tip or substitution idea"
}
Mark "have": true for ingredients that came from the user's list, false for extra pantry items needed.`;

  const userPrompt = `Available ingredients: ${ingredients.join(', ')}`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1400,
        system: systemPrompt,
        messages: [{ role: "user", content: userPrompt }]
      })
    });

    const rawText = await response.text();

    if(!response.ok){
      console.error('API error', response.status, rawText);
      throw new Error('api_error_' + response.status);
    }

    let data;
    try{
      data = JSON.parse(rawText);
    } catch(parseErr){
      console.error('Response was not valid JSON', rawText);
      throw new Error('bad_response_json');
    }

    const textBlock = data.content.filter(b => b.type === 'text').pop();
    if(!textBlock) throw new Error('no_text_block');

    let clean = textBlock.text.trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();

    let recipe;
    try{
      recipe = JSON.parse(clean);
    } catch(parseErr){
      console.error('Recipe JSON was malformed', clean);
      throw new Error('bad_recipe_json');
    }

    renderRecipe(recipe, t);
  } catch(err){
    resultArea.innerHTML = `<div class="state-msg error">${t.errorMsg}</div>`;
    console.error(err);
  } finally {
    genBtn.disabled = ingredients.length === 0;
    genBtn.textContent = t.generateBtn;
  }
}

function renderRecipe(recipe, t){
  const resultArea = $('result-area');

  const ingHtml = recipe.ingredients.map(ing => `
    <li class="${ing.have ? 'have' : ''}">
      <span>${escapeHtml(ing.name)}${ing.have ? ' · ' + t.haveLabel : ''}</span>
      <span class="amount">${escapeHtml(ing.amount)}</span>
    </li>
  `).join('');

  const stepsHtml = recipe.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('');

  resultArea.innerHTML = `
    <div class="result-card">
      <h2>${escapeHtml(recipe.title)}</h2>
      <p class="result-desc">${escapeHtml(recipe.description)}</p>
      <div class="meta-row">
        <div>${t.timeLabel}: <span>${recipe.time_minutes} ${t.minSuffix}</span></div>
        <div>${t.servesLabel}: <span>${recipe.servings}</span></div>
      </div>

      <div class="section-title">${t.ingredientsTitle}</div>
      <ul class="ing-list">${ingHtml}</ul>

      <div class="section-title">${t.stepsTitle}</div>
      <ol class="steps">${stepsHtml}</ol>

      ${recipe.tip ? `<div class="tip-box"><strong>${t.tipTitle}:</strong> ${escapeHtml(recipe.tip)}</div>` : ''}
    </div>
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

$('generate-btn').addEventListener('click', generateRecipe);

renderChips();
renderMealOptions();
</script>

</body>
</html>
